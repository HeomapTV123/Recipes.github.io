<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Page</title>
    <link rel="stylesheet" href="main.css">
    <script src="https://kit.fontawesome.com/36e94b4c48.js" crossorigin="anonymous"></script>
</head>

<body>
    <div class="login-page-container">
        <div class="login-title">
            <header>
                <h2>Login</h2>
            </header>

            <section>
                <p>More than <emp>+1,000</emp> homemade recipes from around the world!</p>
            </section>
        </div>

        <div class="login-form-container">
            <form action="">
                <div class="input-box">
                    <label for="username"></label>
                    <img src="/myProject/login/user.png" class="user-icon">
                    <input type="text"class="username" name="username" id="username" aria-describedby="helpId" placeholder="Enter Username" required>
                </div>
                
                <div class="input-box">
                    <label for="password"></label>
                    <img src="/myProject/login/password.png" class="user-icon">
                    <input type="password" class="password" name="" id="" placeholder="Password" required/>
                </div>
                
                <div class="remember-me">
                    <label for="remember-me"></label>
                        <input type="checkbox" class="remember-me" name="" id="" value="checkedValue" unchecked>
                        Remember me
                </div>

            </form>
            <div class="register-link">
                    <p>Don't have an account?
                        <a href="#">Register here!</a>
                    </p>
                </div>
        </div>
    </div>

</body>
</html>
