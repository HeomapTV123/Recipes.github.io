<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add a Recipe Form</title>
    <link rel="stylesheet" href="/css/main.css"> 
</head>
<body>
    <div class="add-recipe-form-container">
        <div class="add-recipe-form-title">
                <h2>Add Your Own Recipe!</h2>
        </div>
        <form class="add-recipe-form" id="addRecipeForm">
            <div class="input-box" id="recipeLabel">
                    <label for="recipename">Recipe Name</label>
                    <input type="text"  name="recipeName"  aria-describedby="helpId" placeholder="Enter Recipe Name">
            </div>
            <div class="input-box" id="recipeLabel">
                    <label for="recipename">Category</label>
                    <select name="categories" id="category-select">
                        <option value="">--Choose a category--</option>
                    </select>
            </div>            
            <div class="input-box" id="recipeLabel">
                    <label for="recipename">Prep Time (in minutes)</label>
                    <input type="text"  name="recipePrepTime"  aria-describedby="helpId" placeholder="(eg. 20 minutes)">
            </div>            
            <div class="input-box" id="recipeLabel">
                    <label for="recipename">Cook Time (in minutes)</label>
                    <input type="text"  name="recipeCookTime"  aria-describedby="helpId" placeholder="Enter Cook Time">
            </div>
            <div class="upload-image">
                    <label for="input-file" id="drop-area"></label>
                    <input type="file" accept="image/*" id="input-file">
                    <div id="img-view">
                        <img src="https://www.citypng.com/public/uploads/preview/camera-black-icon-download-png-7017516950352149rvpkextdt.png">
                        <p>Drag and drop or click here<br>to upload image</p>
                        <span>Upload any images to desktop</span>
                    </div>
            </div>

            <button type="submit" class="submit-btn">Submit</button>
            <div class="homepage-link">
                <p>Go back to 
                    <a href="/html/mainAfterLogin.html">homepage</a>
                </p>
            </div>
        </form>
    </div>
</body>

        <script type="module" src="/js/script.js"></script>
</html>
